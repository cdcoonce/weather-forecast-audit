name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Lint, test, dbt build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Everything after the install step runs through scripts/offline.sh, in a
      # network namespace with no route out; uv must not try to sync or resolve.
      UV_NO_SYNC: "1"
      UV_OFFLINE: "1"
      WFA_DUCKDB_PATH: ${{ github.workspace }}/.ci/warehouse.duckdb
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies (the only networked step)
        env:
          UV_OFFLINE: "0"
        run: uv sync --locked

      - name: Prove the offline wrapper blocks the network
        run: |
          # The mechanism engaged: the wrapper runs in a different network
          # namespace from the runner, not a passthrough that happens to fail.
          outer=$(readlink /proc/self/ns/net)
          inner=$(scripts/offline.sh readlink /proc/self/ns/net)
          echo "runner netns $outer, wrapper netns $inner"
          test -n "$inner" && test "$outer" != "$inner"
          # The symptom: a connect has no route (ENETUNREACH, not a timeout).
          probe='import socket; socket.create_connection(("1.1.1.1", 443), timeout=5)'
          if out=$(scripts/offline.sh uv run python -c "$probe" 2>&1); then
            echo "::error::network reachable inside scripts/offline.sh"
            exit 1
          fi
          echo "$out" | tail -n 1
          echo "$out" | grep -q "Network is unreachable"

      - name: Ruff
        run: scripts/offline.sh uv run ruff check .

      - name: Pytest
        run: scripts/offline.sh uv run pytest -m "not network"

      - name: dbt build (DuckDB)
        run: |
          mkdir -p "$(dirname "$WFA_DUCKDB_PATH")"
          rm -f "$WFA_DUCKDB_PATH"
          # dbt never creates the raw schema; wfa init-db does, so the
          # empty CI database has raw.* tables (empty) before dbt reads them.
          scripts/offline.sh uv run wfa init-db
          scripts/offline.sh uv run dbt build --project-dir dbt --profiles-dir dbt

      - name: sqlfluff (Snowflake dialect)
        run: scripts/offline.sh uv run sqlfluff lint dbt/models
