            extreme_source: metar_6h
            periods_found: 3
            hourly_observed_f: 57.5
            cli_f: 58.0
      - input: ref('nbm_versions')
        rows:
          - nbm_version: v4.3
            valid_from_utc: "2025-05-27 12:00:00"
            valid_to_utc: "2026-05-05 12:00:00"
