version: 2

models:
  - name: fct_forecast_verification
    description: >
      Daily max/min temperature forecast verification, one row per station,
      run date, lead day (1-3), variable, and source. `raw_nbm` rows come
      from int_raw_verification_pairs; a `baseline` (issue #18) or
      `challenger` row is a model prediction joined back to its raw pair on
      (station, run_date, lead_day, variable), inheriting every
      observation-side column from it. Every row is tagged with
      `nbm_version` and `cycle_regime`, its NBM operational version and
      archived-cycle regime boundaries (issue #12).
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - station
              - run_date
              - lead_day
              - variable
              - source
    columns:
      - name: station
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('station_registry')
                field: icao
      - name: run_date
        data_tests:
          - not_null
      - name: lead_day
        data_tests:
          - not_null
          # v1 scope. A 12Z run also carries a same-day (lead 0) max; the mart
          # must drop it, not pass it through.
          - accepted_values:
              arguments:
                values: [1, 2, 3]
                quote: false
      - name: variable
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["max", "min"]
      - name: source
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["raw_nbm", "baseline", "challenger"]
      - name: tmp_f
        description: >
          NBS's own temperature guidance (degrees F) at the pair's ftime: a
          guidance-side property of the run, known at issuance and identical
          across `source` for one (station, run_date, lead_day, variable).
          Null is legal. A model may use it as a feature; it is never an
          observation (issue #19).
      - name: extreme_source
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["metar_6h", "none"]
      - name: nbm_version
        description: >
          The NBM operational version active at this row's runtime_utc
          (dbt/seeds/nbm_versions.csv, half-open on [valid_from_utc, valid_to_utc)).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('nbm_versions')
                field: nbm_version
      - name: cycle_regime
        description: >
          The archived NBS cycle regime covering this row's run_date
          (dbt/seeds/nbs_cycle_regimes.csv's regime_id).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('nbs_cycle_regimes')
                field: regime_id

unit_tests:
  - name: test_every_source_carries_the_raw_rows_tmp_f
    description: >
      tmp_f is a property of the run, not of the correction: the raw row and
      a baseline prediction joined back to it carry the same tmp_f, and a
      null stays null (issue #19).
    model: fct_forecast_verification
    given:
      - input: ref('int_raw_verification_pairs')
        rows:
          - station: KPHX
            run_date: "2024-07-01"
            lead_day: 1
            variable: max
            source: raw_nbm
            cycle_hour: 13
            runtime_utc: "2024-07-01 13:00:00"
            target_date: "2024-07-02"
            forecast_f: 110.0
            spread_f: 3.0
            tmp_f: 98.5
            observed_f: 108.0
            window_start_utc: "2024-07-01 12:00:00"
            window_end_utc: "2024-07-02 06:00:00"
            scorable: true
            extreme_source: metar_6h
            error_f: 2.0
            nbm_version: v4.3
            cycle_regime: iem_01_07_13_19
          - station: KPHX
            run_date: "2024-07-01"
            lead_day: 2
            variable: max
            source: raw_nbm
            cycle_hour: 13
            runtime_utc: "2024-07-01 13:00:00"
            target_date: "2024-07-03"
            forecast_f: 111.0
            spread_f: 3.0
            tmp_f: null
            observed_f: 109.0
            window_start_utc: "2024-07-02 12:00:00"
            window_end_utc: "2024-07-03 06:00:00"
            scorable: true
            extreme_source: metar_6h
            error_f: 2.0
            nbm_version: v4.3
            cycle_regime: iem_01_07_13_19
      - input: ref('stg_model_predictions')
        rows:
          - station: KPHX
            run_date: "2024-07-01"
            runtime_utc: "2024-07-01 13:00:00"
            lead_day: 1
            variable: max
            target_date: "2024-07-02"
            source: baseline
            forecast_f: 107.5
            raw_forecast_f: 110.0
            retrained_on: "2024-07-01"
            trained_through: "2024-06-30 06:00:00"
            fallback: false
            params: '{"window_days": 30, "min_pairs": 15}'
            generated_at: "2024-07-01 13:05:00"
          - station: KPHX
            run_date: "2024-07-01"
            runtime_utc: "2024-07-01 13:00:00"
            lead_day: 2
            variable: max
            target_date: "2024-07-03"
            source: baseline
            forecast_f: 110.0
            raw_forecast_f: 111.0
            retrained_on: "2024-07-01"
            trained_through: "2024-06-30 06:00:00"
            fallback: false
            params: '{"window_days": 30, "min_pairs": 15}'
            generated_at: "2024-07-01 13:05:00"
    expect:
      rows:
        - {station: KPHX, lead_day: 1, variable: max, source: raw_nbm, tmp_f: 98.5}
        - {station: KPHX, lead_day: 2, variable: max, source: raw_nbm, tmp_f: null}
        - {station: KPHX, lead_day: 1, variable: max, source: baseline, tmp_f: 98.5}
        - {station: KPHX, lead_day: 2, variable: max, source: baseline, tmp_f: null}

  - name: test_baseline_prediction_joins_to_its_raw_row
    description: >
      One raw_nbm row plus one baseline prediction for the same (station,
      run_date, lead_day, variable) gives exactly two output rows: the raw
      row unchanged, and a baseline row whose error_f equals the corrected
      forecast minus the same observed value inherited from the raw row
      (build spec #18 D3.4).
    model: fct_forecast_verification
    given:
      - input: ref('int_raw_verification_pairs')
        rows:
          - station: KPHX
            run_date: "2024-07-01"
            lead_day: 1
            variable: max
            source: raw_nbm
            cycle_hour: 13
            runtime_utc: "2024-07-01 13:00:00"
            target_date: "2024-07-02"
            forecast_f: 110.0
            spread_f: 3.0
            observed_f: 108.0
            window_start_utc: "2024-07-01 12:00:00"
            window_end_utc: "2024-07-02 06:00:00"
            n_obs: 3
            hours_covered: 18
            scorable: true
            extreme_source: metar_6h
            periods_found: 3
            hourly_observed_f: 107.5
            cli_f: 108.0
            error_f: 2.0
            nbm_version: v4.3
            cycle_regime: iem_01_07_13_19
      - input: ref('stg_model_predictions')
        rows:
          - station: KPHX
            run_date: "2024-07-01"
            runtime_utc: "2024-07-01 13:00:00"
            lead_day: 1
            variable: max
            target_date: "2024-07-02"
            source: baseline
            forecast_f: 107.5
            raw_forecast_f: 110.0
            retrained_on: "2024-07-01"
            trained_through: "2024-06-30 06:00:00"
            fallback: false
            params: '{"window_days": 30, "min_pairs": 15}'
            generated_at: "2024-07-01 13:05:00"
    expect:
      rows:
        - station: KPHX
          run_date: "2024-07-01"
          lead_day: 1
          variable: max
          source: raw_nbm
          forecast_f: 110.0
          observed_f: 108.0
          error_f: 2.0
        - station: KPHX
          run_date: "2024-07-01"
          lead_day: 1
          variable: max
          source: baseline
          forecast_f: 107.5
          observed_f: 108.0
          error_f: -0.5
