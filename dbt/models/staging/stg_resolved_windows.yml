version: 2

models:
  - name: stg_resolved_windows
    description: >
      Verification windows resolved from raw guidance and hourly obs, one
      row per (station, runtime_utc, ftime_utc) txn guidance row (see
      `_sources.yml`'s description of `raw.resolved_windows`).
      `warehouse.load_resolved_windows` delete-then-inserts per (station,
      run-date range) (issue #11), so a killed and re-run backfill unit
      must never leave two rows for the same (station, runtime_utc,
      ftime_utc).
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - station
              - runtime_utc
              - ftime_utc
