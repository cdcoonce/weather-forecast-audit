version: 2

models:
  - name: stg_asos_hourly
    description: >
      Hourly ASOS observations, one row per (station, valid_utc).
      `warehouse.load_hourly` delete-then-inserts per (station, observation
      date range) (issue #11), so a killed and re-run backfill unit must
      never leave two rows for the same (station, valid_utc).
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - station
              - valid_utc
