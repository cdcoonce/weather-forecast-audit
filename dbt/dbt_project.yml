name: weather_forecast_audit
version: "0.1.0"
config-version: 2
profile: weather_forecast_audit

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

flags:
  # dbt's anonymous usage tracking posts to a remote collector on every
  # invocation. CI runs dbt with no network, and tracking failures are
  # swallowed silently, so it is off rather than left to fail.
  send_anonymous_usage_stats: false

models:
  weather_forecast_audit:
    +materialized: view
